<!doctype html>
<html lang="en-NZ">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#9fdcff" />
    <title>Trap Line</title>
    <style>
      :root {
        --ink: #14204d;
        --paper: #ffffff;
        --sun: #ffe14a;
        font-family: ui-rounded, 'SF Pro Rounded', 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #9fdcff; color: var(--ink); }
      body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
      #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
      [hidden] { display: none !important; }

      #hud { position: fixed; inset: 0; pointer-events: none; padding: max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; }
      .bar { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
      .pill { background: rgba(255,255,255,.93); border-radius: 999px; padding: 8px 14px; font-weight: 800; font-size: 14px; box-shadow: 0 3px 0 rgba(20,32,77,.18); }
      #birds { white-space: nowrap; font-size: 16px; }
      #brand { align-self: center; font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 0 rgba(20,32,77,.45); }
      .spacer { flex: 1; }

      .sheet { pointer-events: auto; background: var(--paper); border-radius: 22px; padding: 12px; box-shadow: 0 5px 0 rgba(20,32,77,.2); }
      #evening { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 10px; }
      button { font: inherit; font-weight: 900; font-size: 16px; border: 0; border-radius: 16px; min-height: 56px; padding: 8px 10px; cursor: pointer; color: var(--ink); background: #e8eefc; box-shadow: 0 4px 0 rgba(20,32,77,.22); }
      button:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(20,32,77,.22); }
      .tool { display: flex; flex-direction: column; align-items: center; line-height: 1.15; border: 3px solid transparent; }
      .tool.active { border-color: var(--ink); background: #fff; }
      .tool small { font-size: 12px; font-weight: 700; opacity: .7; }
      #go, #next, #share { background: var(--sun); }
      #morning h2 { margin: 2px 4px 6px; font-size: 19px; }
      #morning p { margin: 0 4px 12px; font-size: 15px; line-height: 1.6; }
      #next { width: 100%; }

      .chip { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; margin-right: 6px; white-space: nowrap; }
      .chip i { width: 11px; height: 11px; border-radius: 50%; display: inline-block; border: 1.5px solid rgba(20,32,77,.5); }

      #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      .label { position: absolute; left: 0; top: 0; background: var(--paper); border-radius: 12px; padding: 4px 8px; font-size: 12px; font-weight: 800; white-space: nowrap; box-shadow: 0 2px 0 rgba(20,32,77,.25); }
      .label .chip { margin-right: 2px; }
      .label.bad { background: #ffd9d2; }

      #toast { position: fixed; left: 50%; top: 20%; transform: translate(-50%, 10px); opacity: 0; transition: opacity .18s, transform .18s; background: var(--ink); color: #fff; border-radius: 16px; padding: 10px 16px; font-size: 16px; font-weight: 800; text-align: center; max-width: 86vw; pointer-events: none; }
      #toast.show { opacity: 1; transform: translate(-50%, 0); }
      #hint { position: fixed; left: 50%; top: 13%; transform: translateX(-50%); width: min(340px, 90vw); background: rgba(20,32,77,.86); color: #fff; padding: 10px 16px; border-radius: 16px; font-weight: 700; font-size: 14px; line-height: 1.4; text-align: center; pointer-events: none; }
      #loading { position: fixed; inset: 0; display: grid; place-items: center; background: #9fdcff; font-weight: 900; font-size: 22px; }

      #end { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(20,32,77,.5); padding: 20px; }
      .card { background: var(--paper); border-radius: 26px; padding: 24px 22px; width: min(360px, 100%); text-align: center; box-shadow: 0 8px 0 rgba(20,32,77,.25); }
      .card h1 { margin: 0 0 4px; font-size: 24px; }
      #end-score { font-size: 18px; font-weight: 800; opacity: .8; }
      #end-chorus { list-style: none; padding: 0; margin: 14px 0 18px; text-align: left; }
      #end-chorus li { display: flex; gap: 8px; align-items: baseline; padding: 7px 10px; border-radius: 12px; font-weight: 800; font-size: 17px; opacity: .4; }
      #end-chorus li.here { opacity: 1; background: #eef8e6; }
      #end-chorus small { margin-left: auto; font-weight: 700; opacity: .6; font-size: 12px; }
      .card button { width: 100%; margin-bottom: 10px; }
      @media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Trap Line game board"></canvas>
    <div id="labels"></div>
    <div id="loading">Heading up the trap line…</div>

    <div id="hud" hidden>
      <div class="bar">
        <div class="pill" id="status"></div>
        <div class="pill" id="birds">🐦 0</div>
      </div>
      <div class="spacer"></div>
      <div id="brand"></div>
      <div class="sheet" id="evening">
        <button class="tool" id="tool-trap" aria-label="Trap">🪤 Trap<small><b>0</b> left</small></button>
        <button class="tool" id="tool-tunnel" aria-label="Tracking tunnel">🐾 Tunnel<small><b>0</b> left</small></button>
        <button id="go">Night 🌙</button>
      </div>
      <div class="sheet" id="morning" hidden>
        <h2 id="morning-title"></h2>
        <p id="morning-body"></p>
        <button id="next"></button>
      </div>
    </div>

    <div id="hint" hidden>Tap a tile to set a trap. Predators come over the farm fence and along the stream. Tunnels show whose footprints passed.</div>
    <div id="toast" role="status" aria-live="polite"></div>

    <div id="end" hidden>
      <div class="card">
        <h1 id="end-title"></h1>
        <div id="end-score"></div>
        <ul id="end-chorus"></ul>
        <button id="share">Share result</button>
        <button id="replay">Play again</button>
      </div>
    </div>

    <script type="module" src="/src/trapline/main.ts"></script>
  </body>
</html>
